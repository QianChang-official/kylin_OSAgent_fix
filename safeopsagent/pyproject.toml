[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeopsagent"
description = "面向银河麒麟操作系统的安全智能运维 Agent：模型负责理解与规划，系统负责安全预检、工具白名单、风险评分、最小权限执行与可验证审计"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["../LICENSE", "../NOTICE"]
authors = [{ name = "QianChang" }]
keywords = [
  "kylin",
  "loongarch",
  "ops-agent",
  "aiops",
  "guardrail",
  "audit",
  "mcp",
  "tool-calling",
  "agent-security",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
]
dynamic = ["version", "dependencies"]

# 运行时依赖不在此处重复声明，而是从 backend/requirements.txt 动态读取。
# 部署路径（deploy/install.sh、麒麟离线安装）用的是 requirements 文件，
# 若两处各写一份，迟早会漂移成互相矛盾的两个事实。
# test_packaging_metadata.py 会验证这个绑定确实生效。

[project.optional-dependencies]
# MCP 标准 stdio 服务端。与默认后端分开，使低配麒麟冒烟路径不必安装 MCP SDK。
mcp = ["mcp>=1,<2"]
dev = ["pytest>=8.0.0", "ruff>=0.6", "pytest-cov>=5.0", "hypothesis>=6.100", "pip-audit>=2.7"]

[project.urls]
Repository = "https://github.com/QianChang-official/kylin_OSAgent_fix"

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }
dependencies = { file = ["backend/requirements.txt"] }

[tool.setuptools.packages.find]
# 顶层导入包是 backend，与全项目 `from backend import ...` 的写法一致。
# 名字偏通用，但改名会波及每一个模块、部署单元与文档，收益不抵风险。
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.setuptools.package-data]
"backend" = ["static/console/**/*", "security_intel/*.json", "security_intel/snapshots/*"]

[tool.pytest.ini_options]
# 让 `pytest` 在仓库内直接可跑，不必每次手动导出 PYTHONPATH。
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["backend/static", "frontend", "integrations"]

[tool.ruff.lint]
# 从能稳定通过的规则集起步：真实缺陷（E/F/B）、导入顺序（I）、
# 未使用参数与死代码（ARG/RUF）。风格类规则不在门禁内，避免为了过 lint
# 去改动与本次工作无关的历史代码。
select = ["E", "F", "I", "B", "UP", "ARG", "RUF"]
ignore = [
  "E501",    # 行长由 formatter 管，不做硬门禁
  "B008",    # FastAPI 的 Depends() 默认值是框架惯例
  "RUF001",  # 中文注释里的全角标点是有意为之
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["ARG001", "ARG002", "B011"]
